<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Máscara circular com margem interna (r=37) -->
    <clipPath id="innerCircle">
      <circle cx="50" cy="50" r="37" />
    </clipPath>
  </defs>

  <!-- Círculo Externo Preto -->
  <circle cx="50" cy="50" r="45" stroke="#000000" stroke-width="6" fill="none" />
  
  <g clip-path="url(#innerCircle)">
    <g transform="translate(16.25, 0) skewX(-18)">
      <line x1="50" y1="-20" x2="50" y2="120" stroke="#000000" stroke-width="2" opacity="0.4" />

      <!-- ================= A (Esquerda) ================= -->
      <polygon points="30,-20 46,-20 46,120 30,120" fill="#000000" />
      <polygon points="-50,-20 30,-20 -2,120 -50,120" fill="#000000" />
      <polygon points="0,55 30,55 30,73 0,73" fill="#000000" />

      <!-- ================= N (Direita) ================= -->
      <polygon points="54,-20 70,-20 70,120 54,120" fill="#000000" />
      <polygon points="94,-20 150,-20 150,120 94,120" fill="#000000" />
      <polygon points="54,-20 70,-20 110,120 94,120" fill="#000000" />
    </g>
  </g>
</svg>
